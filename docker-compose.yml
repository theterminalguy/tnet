version: '3.8'

services:
  mysql:
    image: mysql:8.0
    networks:
      - tentn
    ports:
      - 3306:3306
    volumes:
      - mysql:/var/lib/mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    networks:
      - tentn
    ports:
      - 6379:6379
    volumes:
      - redis:/data
    env_file:
      - .env

  web:
    depends_on:
      mysql:
        condition: service_healthy
    build:
      context: .
      target: ${STAGE}
      args:
        - GITHUB_USER=GITHUB_USER
        - GITHUB_PERSONAL_TOKEN=GITHUB_PERSONAL_TOKEN
    networks:
      - tentn
    ports:
      - 5000:5000
    volumes:
      - ./:/app
    env_file:
      - .env
    restart: unless-stopped

  webtest:
    tty: true
    stdin_open: true
    build:
      context: .
      target: test
    networks:
      - tentn
    environment:
      - ENV=test
    env_file:
      - .env

volumes:
  mysql:
  redis:

networks:
  tentn:
    driver: bridge
