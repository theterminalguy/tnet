# This pipeline runs when a PR is raise against the develop branch
steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "Building image for staging"
    args: ["build", "-t", "${_STG_IMAGE}", "--target", "production", "."]
    env:
      - "DOCKER_BUILDKIT=1"

  - name: "gcr.io/cloud-builders/docker"
    id: "Pushing the staging image to Artifact registry"
    args: ["push", "${_STG_IMAGE}"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Deploying staging image to Google Cloud Run"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--image",
        "${_STG_IMAGE}",
        "--region",
        "${_REGION}",
        "--platform",
        "managed",
        "--min-instances",
        "${_MIN_INSTANCES}",
        "--allow-unauthenticated",
      ]

images:
  - "${_STG_IMAGE}"

tags: ["tentn"]

substitutions:
  _MIN_INSTANCES: "0"
  _REGION: "us-central1"
  _SERVICE_NAME: "${REPO_NAME}-staging"
  _ARTIFACT_REPO: "tentn-docker-repo"
  _STG_IMAGE: "us-central1-docker.pkg.dev/${PROJECT_ID}/tentn-docker-repo/${BRANCH_NAME}_stg:${SHORT_SHA}"
