# This pipeline runs when a PR is raise against the develop branch
steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "Building image for running test"
    args:
      [
        "build",
        "-t",
        "${_TEST_IMAGE}",
        "--target",
        "test",
        ".",
        "--build-arg",
        "GITHUB_USER=$_GITHUB_USER",
        "--build-arg",
        "GITHUB_PERSONAL_TOKEN=$_GITHUB_PERSONAL_TOKEN",
      ]
    env:
      - "DOCKER_BUILDKIT=1"

  - name: "gcr.io/cloud-builders/docker"
    id: "Pushing the test image to Artifact registry"
    args: ["push", "${_TEST_IMAGE}"]
    env:
      - "DOCKER_BUILDKIT=1"

  - name: "gcr.io/cloud-builders/docker"
    id: "Running test"
    args:
      [
        "run",
        "-e",
        "ENV=test",
        "-e",
        "PORT=8080",
        "-e",
        "APP_HOST=http://localhost:8080",
        "-e",
        "JWT_SIGNED_SECRET=mysupersecret12345",
        "--rm",
        "${_TEST_IMAGE}",
      ]

  - name: "gcr.io/cloud-builders/docker"
    id: "Building image for production"
    args:
      [
        "build",
        "-t",
        "${_PRD_IMAGE}",
        "--target",
        "production",
        ".",
        "--build-arg",
        "GITHUB_USER=$_GITHUB_USER",
        "--build-arg",
        "GITHUB_PERSONAL_TOKEN=$_GITHUB_PERSONAL_TOKEN",
      ]
    env:
      - "DOCKER_BUILDKIT=1"

  - name: "gcr.io/cloud-builders/docker"
    id: "Pushing the production image to Artifact registry"
    args: ["push", "${_PRD_IMAGE}"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Deploying production image to Google Cloud Run"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--image",
        "${_PRD_IMAGE}",
        "--region",
        "${_REGION}",
        "--platform",
        "managed",
        "--min-instances",
        "${_MIN_INSTANCES}",
        "--allow-unauthenticated",
        "--set-env-vars",
        "ENV=production",
        "--set-env-vars",
        "JWT_SIGNED_SECRET=${_JWT_SIGNED_SECRET}",
        "--set-env-vars",
        "APP_HOST=${_APP_HOST}",
        "--set-env-vars",
        "GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID}",
        "--set-env-vars",
        "GOOGLE_OAUTH_CLIENT_SECRET=${_GOOGLE_OAUTH_CLIENT_SECRET}",
        "--set-env-vars",
        "CLOUDSQL_PG_DBNAME=${_CLOUDSQL_PG_DBNAME}",
        "--set-env-vars",
        "CLOUDSQL_PG_SOCKET_DIR=${_CLOUDSQL_PG_SOCKET_DIR}",
        "--set-env-vars",
        "CLOUDSQL_PG_PASSWORD=${_CLOUDSQL_PG_PASSWORD}",
        "--set-env-vars",
        "CLOUDSQL_PG_INSTANCE=${_CLOUDSQL_PG_INSTANCE}",
        "--set-env-vars",
        "CLOUDSQL_PG_USER=${_CLOUDSQL_PG_USER}",
        "--set-env-vars",
        "SESSION_KEY=${_SESSION_KEY}",
        "--set-env-vars",
        "SLACK_OAUTH_CLIENT_ID=${_SLACK_OAUTH_CLIENT_ID}",
        "--set-env-vars",
        "SLACK_OAUTH_CLIENT_SECRET=${_SLACK_OAUTH_CLIENT_SECRET}",
        "--set-env-vars",
        "SLACK_BOT_TOKEN=${_SLACK_BOT_TOKEN}",
        "--set-env-vars",
        "INTERNAL_API_KEY=${_INTERNAL_API_KEY}",
        "--set-env-vars",
        "STRIPE_SECRET_KEY=${_STRIPE_SECRET_KEY}",
        "--set-env-vars",
        "STRIPE_PUBLISHABLE_KEY=${_STRIPE_PUBLISHABLE_KEY}",
        "--set-env-vars",
        "STRIPE_WEBHOOK_SECRET=${_STRIPE_WEBHOOK_SECRET}",
        "--set-env-vars",
        "STRIPE_PRODUCT_ID=${_STRIPE_PRODUCT_ID}",
        "--set-env-vars",
        "PAYMENT_DRIVER=${_PAYMENT_DRIVER}",
      ]

images:
  - "${_TEST_IMAGE}"
  - "${_PRD_IMAGE}"

tags: ["tentn"]

substitutions:
  _MIN_INSTANCES: "1" # Should scale up when traffic increases
  _REGION: "us-central1"
  _SERVICE_NAME: "${REPO_NAME}-prod"
  _ARTIFACT_REPO: "tentn-docker-repo"
  _TEST_IMAGE: "us-central1-docker.pkg.dev/${PROJECT_ID}/tentn-docker-repo/${REPO_NAME}-test:${SHORT_SHA}"
  _PRD_IMAGE: "us-central1-docker.pkg.dev/${PROJECT_ID}/tentn-docker-repo/${REPO_NAME}-prod:${SHORT_SHA}"
