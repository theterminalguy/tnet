<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/public/views/css/styles.css" />
    <title>Always Hiring</title>
    <style>
      #notfound {
        position: relative;
        height: 100vh;
      }

      #notfound .notfound {
        position: absolute;
        left: 50%;
        top: 50%;
        -webkit-transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }
      .notfound {
        max-width: 520px;
        width: 100%;
        line-height: 1.4;
        text-align: center;
      }
      .notfound .notfound-404 {
        position: relative;
        height: 340px;
      }

      .notfound .notfound-404 h3 {
        font-family: "Cabin", sans-serif;
        position: relative;
        font-size: 16px;
        font-weight: 700;
        text-transform: uppercase;
        color: #262626;
        margin: 0px;
        letter-spacing: 3px;
        padding-left: 6px;
      }
      .notfound .notfound-404 h1 {
        font-family: "Montserrat", sans-serif;
        position: absolute;
        left: 50%;
        top: 50%;
        -webkit-transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
        font-size: 252px;
        font-weight: 900;
        margin: 0px;
        margin-left: 0px;
        color: #262626;
        text-transform: uppercase;
        letter-spacing: -40px;
        margin-left: -20px;
      }

      .notfound h2 {
        font-family: "Cabin", sans-serif;
        font-size: 20px;
        font-weight: 400;
        text-transform: uppercase;
        color: #000;
        margin-top: 0px;
        margin-bottom: 25px;
      }
      img {
        width: 150px;
        max-width: 100%;
      }
      a.notfound-link{
        color: #333; 
        font-weight: bold;
        text-decoration: underline;
      }
      a.notfound-link:hover {
        text-decoration: none;
        color: #000;
      }
    </style>
  </head>
  <body>
    <div id="notfound">
      <a href="/"><img src="/public/views/img/bot1.png" alt="bot" /></a>
      <div class="notfound">
        <div class="notfound-404">
          <h3>Oops! Page not found</h3>
          <h1><span>4</span><span>0</span><span>4</span></h1>
        </div>
        <h2>we are sorry, but the page you requested was not found.</h2>
        <h4><a href="/" class="notfound-link"> <i class="fa fa-chevron-left"></i><i class="fa fa-chevron-left"></i> Click here to go back</a></h4>
      </div>
    </div>
  </body>
</html>
