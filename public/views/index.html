<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/views/css/styles.css">
    <title>Always Hiring</title>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KE2SRKPDR7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-KE2SRKPDR7');
    </script>
</head>

<body>
    <div class="site-page">
        <div class="header">
            <div class="header-logo">
                <img src="/public/views/img/bot1.png" alt="bot" />
                <span class="worldstalent">Organizing the worlds talent</span>
            </div>
            <div class="header-menu">
                <i class="fa fa-times closeButton"></i>
                <a href="talent/auth" class="developer-link" id="btnDeveloper">I'm a Developer</a>
            </div>
            <div class="hambugar">
                <i class="fa fa-bars"></i>
            </div>

        </div>
        <div class="text-container">
            <h1 class="header-text">The recruiters bot</h1>
            <p class="text">
                87% of work happens on Slack - why go elsewhere to source the best
                talent? Connect directly with talent across the globe without leaving
                your workspace
            </p>
            <a href="/recruiter/auth" id="btnAddToSlack">
                <p class="toslack"><img src="/public/views/img/addtoslack.png" alt="addtoslack"></p>
            </a>

            <div class="midimage">
                <img src="/public/views/img/midimage.png" alt="midimage" />
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->

    <script>
        const hamburgerButton = document.querySelector(".hambugar");
        const closeButton = document.querySelector(".closeButton");
        const mobileMenu = document.querySelector(".header-menu");

        hamburgerButton.addEventListener("click", () => {
            mobileMenu.classList.toggle("show")
        });

        closeButton.addEventListener("click", () => {
            mobileMenu.classList.remove("show")
        });

        const btnAddToSlack = document.querySelector("#btnAddToSlack");
        btnAddToSlack.addEventListener("click", () => {
            console.log("inside add to slack");
            window.gtag('event', 'add_to_slack');
            window.location.href = "/recruiter/auth";
        });

        const btnDeveloper = document.querySelector("#btnDeveloper");
        btnDeveloper.addEventListener("click", () => {
            console.log("inside developer");
            window.gtag('event', 'developer_link');
            window.location.href = "/talent/auth";
        });
    </script>

</body>

</html>
